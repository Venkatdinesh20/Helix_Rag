# Cloud Build CI/CD Pipeline
# Architecture Section 9 — CI/CD Pipeline
#
# Triggered on every push to the main branch.
# Pipeline stages:
#   1. Unit & integration tests  — fail fast before building anything
#   2. Build Docker image        — multi-stage, slim runtime image
#   3. Push to Artifact Registry — versioned by commit SHA and :latest
#   4. Deploy to Cloud Run       — zero-downtime rolling update
#
# Prerequisites (one-time setup):
#   gcloud artifacts repositories create rag-repo \
#     --repository-format=docker \
#     --location=us-central1
#
#   gcloud run services create rag-api \
#     --image us-central1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:latest \
#     --region us-central1 \
#     --platform managed \
#     --set-secrets OPENAI_API_KEY=openai-api-key:latest
#
# Substitution variables (set in Cloud Build trigger config):
#   _REGION          : GCP region (e.g. us-central1)
#   _SERVICE_NAME    : Cloud Run service name (e.g. rag-api)
#   _REPOSITORY      : Artifact Registry repo name (e.g. rag-repo)

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: rag-api
  _REPOSITORY: rag-repo

steps:
  # ── Step 1: Run tests ─────────────────────────────────────────────────────
  # Run inside the same Python image to guarantee version parity.
  # We install deps fresh here (no venv) so the test environment is clean.
  # If any test fails, Cloud Build stops here — the image is never built.
  - name: python:3.12-slim
    id: run-tests
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt
        python -m pytest tests/ -v --tb=short
    env:
      - ENVIRONMENT=ci
      - OPENAI_API_KEY=test-key-ci   # demo mode — no real LLM calls in tests

  # ── Step 2: Build Docker image ────────────────────────────────────────────
  # Tag with both the commit SHA (immutable) and :latest (for easy deployment).
  # The --cache-from pull re-uses the previous :latest layer cache to speed up
  # repeated builds when only code (not dependencies) changed.
  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - --cache-from
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --tag
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .
    waitFor:
      - run-tests   # only build if tests passed

  # ── Step 3: Push to Artifact Registry ────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
    waitFor:
      - build-image

  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
    waitFor:
      - build-image

  # ── Step 4: Deploy to Cloud Run ───────────────────────────────────────────
  # --no-traffic: deploy new revision but keep sending 100% traffic to old one
  # After validation you can promote via: gcloud run services update-traffic
  # For this pipeline we deploy straight to traffic (appropriate for a demo project).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-secrets
      - OPENAI_API_KEY=openai-api-key:latest
      - --set-env-vars
      - OPENAI_MODEL=gpt-4o-mini,ENVIRONMENT=production
      # Free-tier friendly sizing.
      # min-instances=0 is REQUIRED for free-tier (no idle billing).
      # Cold-start: ~15-25 s while sentence-transformers + cross-encoder load.
      # Bump memory to 2Gi and cpu to 2 once you're past the free tier.
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --concurrency
      - "10"
      - --timeout
      - "300"
      - --cpu-boost
    waitFor:
      - push-sha

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # faster builds — worth it for iterating quickly

timeout: 1800s   # 30-minute hard cap — alert if a build takes longer than this
